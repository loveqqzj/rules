name: Convert Mihomo Rules to MRS

on:
  workflow_dispatch:
  push:
    paths:
      - 'mihomo/domain/**'
      - 'mihomo/ipcidr/**'
  schedule:
    - cron: '0 0 * * *'

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6 # 升级到最新版本以适配 Node.js 24

    - name: Download Mihomo Core
      run: |
        # 清理可能残留的临时文件
        rm -f mihomo.gz mihomo-core
        
        TAG=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep "tag_name" | cut -d '"' -f 4)
        curl -L -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${TAG}/mihomo-linux-amd64-${TAG}.gz"
        
        # 使用 gzip 解压并直接重命名输出到 mihomo-core
        gzip -dc mihomo.gz > mihomo-core
        
        # 清理压缩包，赋予执行权限，测试运行
        rm -f mihomo.gz
        chmod +x mihomo-core
        ./mihomo-core -v

    - name: Convert Rules to MRS
      run: |
        mkdir -p mihomo/mrs/domain
        mkdir -p mihomo/mrs/ipcidr

        # 1. 转换 Domain 类型的 YAML 规则
        if [ -d "mihomo/domain" ]; then
          for file in mihomo/domain/*.yaml; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" .yaml)
              ./mihomo-core convert-ruleset domain yaml "$file" "mihomo/mrs/domain/${filename}.mrs"
              echo "Converted domain: $filename"
            fi
          done
        fi

        # 2. 转换 IPCIDR 类型的 YAML 规则
        if [ -d "mihomo/ipcidr" ]; then
          for file in mihomo/ipcidr/*.yaml; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" .yaml)
              ./mihomo-core convert-ruleset ipcidr yaml "$file" "mihomo/mrs/ipcidr/${filename}.mrs"
              echo "Converted ipcidr: $filename"
            fi
          done
        fi

    - name: Commit and Push MRS Files
      uses: stefanzweifel/git-auto-commit-action@v7 # 升级到最新版本以适配 Node.js 24
      with:
        commit_message: "Auto-update Mihomo MRS binary rules"
        branch: main
        file_pattern: "mihomo/mrs/**"
